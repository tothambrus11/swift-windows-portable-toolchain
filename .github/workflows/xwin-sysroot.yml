name: xwin-sysroot

on:
  push:
    branches: [exp/xwin-sysroot]
  workflow_dispatch:
    inputs:
      swift_version:
        description: 'Swift version (empty = latest stable)'
        required: false
        default: ''
      arm64:
        description: 'Also run on windows-11-arm'
        type: boolean
        default: false

jobs:
  portable-swift:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
          - runner: windows-latest
            arch: x64
            full: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Hide Visual Studio, Build Tools and Windows SDK
        run: |
          $t = Measure-Command { & ./xwin/hide-vs.ps1 | Out-Host }
          "hide-vs took $([math]::Round($t.TotalSeconds,1))s"

      - name: Verify no VS / MSVC / Windows SDK is reachable
        run: |
          . ./xwin/clean-env.ps1
          $bad = @()
          foreach ($c in 'cl','link','vswhere','clang','lld-link','swift','gcc') {
            $cmd = Get-Command $c -ErrorAction SilentlyContinue
            if ($cmd) { $bad += "$c -> $($cmd.Source)" }
          }
          foreach ($p in 'C:\Program Files\Microsoft Visual Studio','C:\Program Files (x86)\Microsoft Visual Studio','C:\Program Files (x86)\Windows Kits',
                         'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows Kits\Installed Roots') {
            if (Test-Path $p) { $bad += "still present: $p" }
          }
          $vsw = Get-ChildItem 'C:\Program Files*' -Recurse -Filter vswhere.exe -Depth 4 -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch '\.hidden' }
          if ($vsw) { $bad += "vswhere found: $($vsw.FullName)" }
          Get-ChildItem env: | Where-Object { $_.Name -match '^(INCLUDE|LIB|VC|Windows ?Sdk|UniversalCRT|UCRT)' } | Format-Table | Out-Host
          if ($bad) { $bad | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          "OK: no cl/link/vswhere/clang on PATH, VS + Windows Kits hidden"

      - name: License gate refuses to run without -AcceptLicense
        run: |
          . ./xwin/clean-env.ps1
          try { & ./xwin/setup-portable-swift.ps1 -Target "$env:RUNNER_TEMP\nolicense" | Out-Host; Write-Host '::error::setup ran without -AcceptLicense'; exit 1 }
          catch { "OK, refused: $_" }
          if (Test-Path "$env:RUNNER_TEMP\nolicense\Swift") { Write-Host '::error::downloaded without license acceptance'; exit 1 }

      - name: Setup portable Swift (VS-manifest CRT + NuGet SDK)
        run: |
          . ./xwin/clean-env.ps1
          $t = Measure-Command {
            # 'full' job: all components + the no-asserts toolchain + modulemaps via VFS overlay instead of copies
            $extra = @{}; if ('${{ matrix.full }}' -eq 'true') { $extra = @{ Full = $true; NoAsserts = $true; ModulemapMode = 'overlay' } }
            & ./xwin/setup-portable-swift.ps1 -Target "$env:LOCALAPPDATA\swift-portable" -AcceptLicense -SwiftVersion '${{ github.event.inputs.swift_version }}' @extra | Out-Host
          }
          if (-not (Test-Path "$env:LOCALAPPDATA\swift-portable\activate.ps1")) { exit 1 }
          "setup took $([math]::Round($t.TotalSeconds,1))s"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "$env:LOCALAPPDATA\swift-portable\setup-stats.json","$env:LOCALAPPDATA\swift-portable\activate.ps1" out/
          Get-Content "$env:LOCALAPPDATA\swift-portable\setup-stats.json"
          Get-Content "$env:LOCALAPPDATA\swift-portable\activate.ps1"
          "## Setup stats (${{ matrix.arch }})`n``````json`n$(Get-Content -Raw "$env:LOCALAPPDATA\swift-portable\setup-stats.json")`n``````" >> $env:GITHUB_STEP_SUMMARY

      - name: Layout overview
        run: |
          $r = "$env:LOCALAPPDATA\swift-portable"
          Get-ChildItem $r\winsysroot -Directory -Recurse -Depth 5 | Select-Object -ExpandProperty FullName
          'Largest toolchain binaries:'
          Get-ChildItem $r\Swift\Toolchains -Recurse -File | Sort-Object Length -Descending | Select-Object -First 25 | ForEach-Object { '{0,8:n0} MB  {1}' -f ($_.Length/1MB), $_.Name }
          foreach ($d in Get-ChildItem $r -Directory -Recurse -Depth 7) {
            $s = (Get-ChildItem $d.FullName -Recurse -File | Measure-Object Length -Sum).Sum
            if ($s -gt 40MB) { "{0,8:n0} MB  {1}" -f ($s/1MB), $d.FullName }
          }

      - name: Test matrix
        run: |
          & ./xwin/run-tests.ps1 -Root "$env:LOCALAPPDATA\swift-portable" -ResultsFile "$env:GITHUB_WORKSPACE\out\results-${{ matrix.arch }}.json"

      - name: Fresh-shell check (cmd + activate.bat)
        if: always()
        shell: cmd
        run: |
          set "PATH=C:\Windows\System32;C:\Windows"
          set INCLUDE=
          set LIB=
          call "%LOCALAPPDATA%\swift-portable\activate.bat"
          cd /d "%GITHUB_WORKSPACE%\xwin\tests\swiftpkg"
          swift build -c release && swift run -c release Hello

      - name: Optimized-build probe (informational)
        if: always()
        continue-on-error: true
        run: |
          . ./xwin/clean-env.ps1
          . "$env:LOCALAPPDATA\swift-portable\activate.ps1"
          & ./xwin/optimize-probe.ps1

      - name: Non-admin setup + build (separate standard user via scheduled task)
        if: always() && matrix.arch == 'x64' && !matrix.full
        continue-on-error: true
        run: |
          # A real standard (non-Administrators) local account runs the whole setup + SwiftPM build/test.
          $u = 'swiftnonadmin'; $pw = 'Sw!' + [guid]::NewGuid().ToString('N').Substring(0, 16)
          net user $u $pw /add /y | Out-Null
          net localgroup Administrators | Select-String $u | ForEach-Object { Write-Host "::error::$u is an admin" }
          $na = 'C:\Users\Public\na'
          Remove-Item -Recurse -Force $na -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $na | Out-Null
          Copy-Item -Recurse "$env:GITHUB_WORKSPACE\xwin" "$na\xwin"
          icacls $na /grant "${u}:(OI)(CI)F" /T /Q | Out-Null
          $log = "$na\nonadmin.log"
          $cmd = "`"C:\Program Files\PowerShell\7\pwsh.exe`" -NoProfile -ExecutionPolicy Bypass -File $na\xwin\nonadmin-check.ps1 -Root $na\swift -Log $log"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          # Attempt 1: CreateProcessWithLogonW (Start-Process -Credential)
          try {
            $cred = New-Object System.Management.Automation.PSCredential($u, (ConvertTo-SecureString $pw -AsPlainText -Force))
            $proc = Start-Process -FilePath 'C:\Program Files\PowerShell\7\pwsh.exe' -Credential $cred -LoadUserProfile -WorkingDirectory $na -PassThru `
              -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "$na\xwin\nonadmin-check.ps1", '-Root', "$na\swift", '-Log', $log)
            "started pid $($proc.Id) as $u via Start-Process -Credential"
          } catch { "Start-Process -Credential failed: $_" }
          Start-Sleep 20
          if (-not (Test-Path $log)) {
            # Attempt 2: scheduled task (needs SeBatchLogonRight: 'Performance Log Users' has it by default, and is not an admin group)
            net localgroup 'Performance Log Users' $u /add | Out-Null
            schtasks /create /tn swiftnonadmin /tr $cmd /sc once /st 23:59 /ru $u /rp $pw /rl LIMITED /f
            schtasks /run /tn swiftnonadmin
          }
          while (-not (Test-Path "$log.done") -and $sw.Elapsed.TotalMinutes -lt 12) { Start-Sleep 10 }
          schtasks /query /tn swiftnonadmin /fo list /v 2>$null | Select-String 'Status|Last Result|Run As User'
          Get-Content $log -ErrorAction SilentlyContinue
          "took $([math]::Round($sw.Elapsed.TotalSeconds))s"
          if (-not (Test-Path "$log.done")) { Write-Host '::error::non-admin run did not finish'; exit 1 }
          exit [int](Get-Content "$log.done")

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.arch }}${{ matrix.full && '-full' || '' }}
          path: out/

  control-with-vs:
    # Control experiment: official installer on a runner WITH Visual Studio (nothing hidden)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift with the official installer (VS present)
        run: |
          $v = (Invoke-RestMethod https://www.swift.org/api/v1/install/releases.json)[-1].name
          curl.exe -sL -o "$env:RUNNER_TEMP\swift.exe" "https://download.swift.org/swift-$v-release/windows10/swift-$v-RELEASE/swift-$v-RELEASE-windows10.exe"
          $p = Start-Process "$env:RUNNER_TEMP\swift.exe" -ArgumentList '/quiet', '/norestart', '/log', "$env:RUNNER_TEMP\swift-install.log" -Wait -PassThru
          "installer exit code $($p.ExitCode)"
          $u = [Environment]::GetEnvironmentVariable('Path', 'User'); $m = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          "Path=$u;$m" >> $env:GITHUB_ENV
          foreach ($n in 'SDKROOT') { $val = [Environment]::GetEnvironmentVariable($n, 'User'); if (-not $val) { $val = [Environment]::GetEnvironmentVariable($n, 'Machine') }; "$n=$val" >> $env:GITHUB_ENV }
      - name: Optimized-build probe with VS present
        run: |
          swift --version
          & ./xwin/optimize-probe.ps1
      - name: SwiftPM release FoundationDemo with VS present
        run: |
          cd xwin/tests/swiftpkg
          swift run -c release FoundationDemo
